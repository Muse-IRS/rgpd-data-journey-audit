name: Validate public boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required public files
        run: |
          test -f README.md
          test -f LICENSE
          test -f NOTICE
          test -f docs/PUBLIC_BOUNDARY.md
          test -f docs/DATA_JOURNEY_MODEL.md
          test -f docs/DATA_VALUE_AND_RECOMMENDATION.md
          test -f docs/LOCAL_ACTION_JOURNAL.md
          test -f docs/USER_LOCAL_STORAGE_EXPLANATION.md
          test -f docs/AUTOMATIC_SITE_ENTITY_FETCH.md
          test -f docs/PRIVACY_READABILITY_REFERENCE.md
          test -f docs/VIGILANCE_GAUGE_MODEL.md
          test -f docs/VIGILANCE_GAUGE_NEEDLE.md
          test -f docs/SSF_IRS_VALIDATION_MODEL.md
          test -f docs/ENTITY_MATCH_PANEL.md
          test -f docs/BRAND_COLOR_SYSTEM.md
          test -f docs/MUZE_X_PORTAL_ATTRACTOR.md
          test -f examples/vigilance-gauge-output.md
          test -f public/index.html
          test -f public/privacy.html
          test -f public/data-value/index.html
          test -f public/assets/app.js
          test -f public/assets/entity-auto-fetch.js
          test -f public/assets/styles.css
          test -f public/assets/auto-fetch.css
          test -f public/assets/brand-logo.svg
          test -f public/assets/favicon.svg
          test -f public/assets/brand.css
          test -f public/assets/data-value.css
          test -f public/assets/mesh-portal.css
          test -f public/assets/mesh-portal.js

      - name: Check JavaScript syntax
        run: |
          node --check public/assets/app.js
          node --check public/assets/entity-auto-fetch.js
          node --check public/assets/mesh-portal.js

      - name: Require full-screen attractor on every public HTML page
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          missing = []
          for path in Path('public').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'mesh-portal.css' not in text or 'mesh-portal.js' not in text:
                  missing.append(str(path))
          if missing:
              raise SystemExit('Portal attractor missing from: ' + ', '.join(missing))
          PY
          grep -q 'muze-mesh-field' public/assets/mesh-portal.js
          grep -q 'position:fixed' public/assets/mesh-portal.css
          grep -q 'ATTRACTOR_PRESENT' docs/MUZE_X_PORTAL_ATTRACTOR.md
          if grep -q 'muze-portal-network' public/assets/mesh-portal.js; then
            echo 'Legacy in-flow portal block must not return.' >&2
            exit 1
          fi

      - name: Preserve bottom swarm anchor and conceptual interface note
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'muze-mesh-anchor-section' public/assets/mesh-portal.js
          grep -q 'swarmAnchor' public/assets/mesh-portal.js
          grep -q 'updateAnchor' public/assets/mesh-portal.js
          grep -q 'Logique d’interface conceptuelle Muze-X' public/assets/mesh-portal.js
          grep -q 'métaphore visuelle ≠ modèle scientifique' public/assets/mesh-portal.js
          grep -q 'muze-mesh-anchor-orb' public/assets/mesh-portal.css
          grep -q 'muze-interface-technique' public/assets/mesh-portal.css

      - name: Enforce public repository boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'PRIVATE_CASE|PERSONAL_CASE|private_matrix|research_protocol|secret_key|api_key|sk-[A-Za-z0-9_-]+' . --exclude-dir=.git --exclude='validate-public-boundary.yml'; then
            echo 'Private or sensitive implementation marker found in public repository.' >&2
            exit 1
          fi

      - name: Reject committed local archives and environment files
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '.env' -o -name '.env.local' -o -name '*.zip' -o -name '*.7z' -o -name '*.rar' \) | grep -q .; then
            echo 'Environment files or local archives must not be committed.' >&2
            exit 1
          fi
